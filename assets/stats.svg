<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="t d">
<title id="t">At a glance</title>
<desc id="d">Six headline numbers from Frank's resume.</desc>
<style>
text{font-family:'Avenir Next','Avenir','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
.h{font-size:24px;font-weight:600;fill:#e8eef5}
.sub{font-size:15px;fill:#7c8aa0;letter-spacing:.4px}
.lbl{font-size:15px;fill:#e8eef5}
.lbl2{font-size:13px;fill:#aab6c8}
.cap{font-size:12px;fill:#7c8aa0;letter-spacing:1.4px;text-transform:uppercase}
.mono{font-family:'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;font-size:13px;fill:#aab6c8}
.big{font-size:40px;font-weight:600;fill:#e8eef5;letter-spacing:.5px}.tile{opacity:0;animation:in .8s ease-out forwards}@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@media (prefers-reduced-motion: reduce){.tile{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
@media (prefers-reduced-motion: reduce){.flow{display:none}}
</style>
<defs>
