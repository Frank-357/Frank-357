<g class="tile" style="animation-delay:0.60s"><rect x="802" y="178" width="373" height="132" rx="12" fill="#131d31" stroke="#24304a"/><rect x="802" y="194" width="4" height="100" rx="2" fill="#d95926"/><text x="824" y="228" class="big" style="font-size:30px">Faculty Choice</text><text x="824" y="256" class="lbl2">Award, GW Business Analytics</text><text x="824" y="274" class="lbl2">Capstone (four-person team)</text><text x="824" y="298" class="cap" style="font-size:11px">Procurement Pilot</text></g>
