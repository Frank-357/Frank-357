<g class="tile" style="animation-delay:0.36s"><rect x="24" y="178" width="373" height="132" rx="12" fill="#131d31" stroke="#24304a"/><rect x="24" y="194" width="4" height="100" rx="2" fill="#d95926"/><text x="46" y="228" class="big" style="font-size:30px">~120 s → &lt;1 s</text><text x="46" y="256" class="lbl2">recurring-query latency after the</text><text x="46" y="274" class="lbl2">hybrid LangGraph re-architecture</text><text x="46" y="298" class="cap" style="font-size:11px">Procurement Pilot</text></g>
