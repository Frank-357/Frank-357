<stop offset="0" stop-color="#0c1322"/><stop offset=".7" stop-color="#0f1626"/><stop offset="1" stop-color="#1c1020"/>
</linearGradient>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#aab6c8"/></marker>
<clipPath id="cardclip"><rect x="1" y="1" width="1198" height="328" rx="18"/></clipPath>
</defs>
<rect x="1" y="1" width="1198" height="328" rx="18" fill="url(#cardbg)"/>
