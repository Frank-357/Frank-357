<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="t d">
<title id="t">Procurement Pilot architecture</title>
<desc id="d">Hybrid LangGraph system: pre-execution request review, an LLM for open-ended intent and task planning, deterministic parsers and direct analytics tools for decision-critical workflows, a Streamlit decision workflow and post-solve approve, modify or discard controls, with execution traces. Recurring query execution went from about 120 seconds to sub-second.</desc>
<style>
text{font-family:'Avenir Next','Avenir','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
.h{font-size:24px;font-weight:600;fill:#e8eef5}
.sub{font-size:15px;fill:#7c8aa0;letter-spacing:.4px}
.lbl{font-size:15px;fill:#e8eef5}
.lbl2{font-size:13px;fill:#aab6c8}
.cap{font-size:12px;fill:#7c8aa0;letter-spacing:1.4px;text-transform:uppercase}
.mono{font-family:'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;font-size:13px;fill:#aab6c8}
.flow{stroke:#e07a8a;stroke-width:3;stroke-linecap:round;stroke-dasharray:14 1400;animation:run 5s linear infinite}@keyframes run{from{stroke-dashoffset:1414}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
@media (prefers-reduced-motion: reduce){.flow{display:none}}
</style>
<defs>
