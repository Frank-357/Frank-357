<path d="M0,0 L10,5 L0,10 z" fill="#aab6c8"/></marker>
<clipPath id="cardclip"><rect x="1" y="1" width="1198" height="478" rx="18"/></clipPath>
</defs>
<rect x="1" y="1" width="1198" height="478" rx="18" fill="url(#cardbg)"/>
<rect x="0" y="0" width="1200" height="5" fill="#800000" clip-path="url(#cardclip)"/>
<rect x="1" y="1" width="1198" height="478" rx="18" fill="none" stroke="#24304a" stroke-width="1.5"/>

<text x="32" y="50" class="h">Procurement Pilot — hybrid LangGraph decision system</text>
<text x="32" y="74" class="sub">System Architect · four-person GW Business Analytics capstone · Jan – May 2026 · Faculty Choice Award</text>
